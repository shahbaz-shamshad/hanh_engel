spring.application.name=WebPlatformForHanhEngel


spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:8082}
#server.port=8082
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

frontend.url=${FRONTEND_URL}

spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.jpa.properties.hibernate.event.merge.entity_copy_observer=allow
spring.jpa.properties.javax.persistence.validation.mode=


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Load from environment variable in production
jwt.secret=${JWT_SECRET:defaultDevSecretOnlyForLocalTesting}

# Token expiration (default: 1 hour)
jwt.expiration.ms=86400000  

